{% extends 'admin/base.html' %}{% block head_tail %}{{ super() }}
<link href='{{ url_for("static", filename="css/admin_custom.css") }}' rel='stylesheet'>
<link rel="stylesheet" href="https://unpkg.com/easymde/dist/easymde.min.css">
<style>
    .EasyMDEContainer {
        margin-top: 4px;
    }

    .EasyMDEContainer .CodeMirror {
        background: rgba(15, 23, 42, 0.8) !important;
        color: #f8fafc !important;
        border: 1px solid rgba(56, 189, 248, 0.4) !important;
        border-top: none !important;
        min-height: 300px;
        font-size: 14px;
        font-family: 'Inter', monospace;
    }

    .editor-toolbar {
        background: rgba(30, 41, 59, 0.9) !important;
        border: 1px solid rgba(56, 189, 248, 0.4) !important;
        border-bottom: 1px solid rgba(56, 189, 248, 0.2) !important;
    }

    .editor-toolbar button {
        color: #f8fafc !important;
    }

    .editor-toolbar button:hover,
    .editor-toolbar button.active {
        background: rgba(56, 189, 248, 0.15) !important;
        border-color: rgba(56, 189, 248, 0.4) !important;
    }

    .editor-toolbar i.separator {
        border-color: rgba(56, 189, 248, 0.2) !important;
    }

    .editor-preview {
        background: #0f172a;
        color: #f8fafc;
    }

    .editor-preview pre {
        background: rgba(0, 0, 0, 0.4);
        padding: 12px;
        border-radius: 4px;
    }
</style>
{% endblock %}
{% block tail %}{{ super() }}
<script src="https://unpkg.com/easymde/dist/easymde.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        document.querySelectorAll('textarea.easymde-editor').forEach(function (el) {
            new EasyMDE({
                element: el,
                spellChecker: false,
                autosave: { enabled: false },
                toolbar: ["bold", "italic", "heading", "|", "quote", "unordered-list", "ordered-list", "|", "link", "image", "code", "table", "|", "preview", "side-by-side", "fullscreen", "|", "guide"],
                minHeight: "300px",
            });
        });
    });
</script>
{% endblock %}
