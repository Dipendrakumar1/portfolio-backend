{% extends 'admin/base.html' %}

{% block head_tail %}{{ super() }}
<link href='{{ url_for("static", filename="css/admin_custom.css") }}' rel='stylesheet'>
<link href="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.snow.css" rel="stylesheet">
<style>
    /* ===== Quill Editor Styling ===== */
    .quill-wrapper {
        width: 100% !important;
        margin-bottom: 15px;
    }
    .ql-toolbar {
        background: rgba(30, 41, 59, 0.95) !important;
        border: 1px solid rgba(56, 189, 248, 0.4) !important;
        border-bottom: 1px solid rgba(56, 189, 248, 0.3) !important;
        border-radius: 12px 12px 0 0 !important;
        padding: 8px 12px !important;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }
    .ql-container {
        width: 100% !important;
        max-width: 100% !important;
        background: #0f172a !important;
        border: 1px solid rgba(56, 189, 248, 0.4) !important;
        border-top: none !important;
        border-radius: 0 0 12px 12px !important;
        min-height: 350px !important;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif !important;
        font-size: 15px !important;
        box-sizing: border-box !important;
        overflow: hidden !important;
    }
    .ql-editor {
        color: #f1f5f9 !important;
        background: #0f172a !important;
        min-height: 350px !important;
        padding: 20px !important;
        font-size: 15px !important;
        line-height: 1.7 !important;
        width: 100% !important;
        box-sizing: border-box !important;
        overflow-y: auto !important;
    }
    .ql-editor.ql-blank::before {
        color: #94a3b8 !important;
        font-style: normal !important;
        opacity: 0.7 !important;
    }
    .ql-editor::-webkit-scrollbar { width: 8px !important; }
    .ql-editor::-webkit-scrollbar-track { background: #1e293b !important; }
    .ql-editor::-webkit-scrollbar-thumb { background: #334155 !important; border-radius: 4px !important; }
    .ql-editor::-webkit-scrollbar-thumb:hover { background: #475569 !important; }
    .ql-stroke { stroke: #f1f5f9 !important; }
    .ql-fill { fill: #f1f5f9 !important; }
    .ql-picker { color: #f1f5f9 !important; }
    .ql-picker-options { background: rgba(30, 41, 59, 0.95) !important; border: 1px solid rgba(56, 189, 248, 0.4) !important; border-radius: 8px !important; }
    .ql-picker-item:hover { color: #38bdf8 !important; }
    .ql-toolbar button:hover .ql-stroke { stroke: #38bdf8 !important; }
    .ql-toolbar button:hover .ql-fill { fill: #38bdf8 !important; }
    .ql-toolbar button.ql-active .ql-stroke { stroke: #38bdf8 !important; }
    .ql-toolbar button.ql-active .ql-fill { fill: #38bdf8 !important; }
    textarea.quill-editor { display: none !important; }
</style>
{% endblock %}

{% block tail %}{{ super() }}
<script src="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        document.querySelectorAll('textarea.quill-editor').forEach(function (el) {
            var form = el.closest('form');

            // Create a div for Quill editor (insert before the hidden textarea)
            var editorDiv = document.createElement('div');
            editorDiv.style.width = '100%';
            editorDiv.style.marginBottom = '10px';
            el.parentNode.insertBefore(editorDiv, el);

            // Initialize Quill on the div
            var quill = new Quill(editorDiv, {
                theme: 'snow',
                modules: {
                    toolbar: [
                        [{ 'header': [1, 2, 3, 4, false] }],
                        ['bold', 'italic', 'underline', 'strike'],
                        [{ 'color': [] }, { 'background': [] }],
                        [{ 'list': 'ordered' }, { 'list': 'bullet' }],
                        [{ 'indent': '-1' }, { 'indent': '+1' }],
                        [{ 'align': [] }],
                        ['link', 'image', 'video'],
                        ['blockquote', 'code-block'],
                        ['clean']
                    ]
                },
                placeholder: 'Write your rich formatted content here...',
            });

            // Set initial content from textarea without losing any HTML
            var existingContent = el.value || '';
            if (existingContent) {
                quill.root.innerHTML = existingContent;
            }

            // Real-time synchronization to textarea
            quill.on('text-change', function () {
                el.value = quill.root.innerHTML;
            });

            // On form submit, ensure final sync
            if (form) {
                form.addEventListener('submit', function () {
                    el.value = quill.root.innerHTML;
                });
            }
        });
    });
</script>
{% endblock %}
